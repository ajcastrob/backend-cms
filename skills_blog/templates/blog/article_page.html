{% extends "base.html" %}
{% load wagtailcore_tags wagtailimages_tags %}
{% block title %}{{ page.title }}{% endblock %}
{% block content %}
<article>
  <h1>{{ page.title }}</h1>
  <p>{{ page.intro }}</p>
  {% if page.image %}
    {% image page.image width-800 as cover %}
    <img src="{{ cover.url }}" alt="{{ page.caption }}">
  {% endif %}
  {{ page.body|richtext }}
</article>
{% endblock %}
